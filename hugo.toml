theme = '_menus_ttms'
languageCode = 'en-tt'
title = 'Merengue Restaurant'
baseURL = 'https://merengue.ttmenus.com/'
enableRobotsTXT = true
timeout = '180s'

[module]
[[module.mounts]]
source = 'content/_index.md'
target = 'content/_index.md'

[[module.mounts]]
source = 'content/.generated'
target = 'content'

[[module.mounts]]
source = 'themes/_menus_ttms/content'
target = 'content'

[markup]

[markup.goldmark]

[markup.goldmark.parser]
attribute = true

[markup.goldmark.renderer]
unsafe = true

[outputFormats]

[outputFormats.menuitemsJSON]
mediaType = "application/json"
baseName = "menu-items"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "JSON"]
section = ["HTML", "JSON"]
page = ["HTML", "JSON"]

